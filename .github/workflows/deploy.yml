# --- Deployment workflow for a single package in TeamTomo ---
#
# Triggers on any tag matching "*@v*" — both the root "teamtomo@v*" meta-package tag pushed
# by the developer and the per-package tags created by coordinated_release.yml.
# The workflow performs the following steps:
# 1. Verifies that the tag is on the main branch to ensure only stable code is deployed.
# 2. Checks that the CI tests have passed for the commit associated with the tag.
# 3. Extracts the package name from the tag and runs tests for that specific package to ensure it is functioning correctly.
# 4. Builds the package and publishes it to PyPI.
# 5. Creates a GitHub Release with the built package attached.

name: Deploy

on:
  push:
    tags:
      - '*@v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name to deploy (e.g., torch-2dtm@v0.6.2rc7)'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7

      - name: Verify tag on main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "ERROR: Tag is not on main branch. Cannot deploy."
            exit 1
          fi

      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHA=$(git rev-list -n 1 ${{ github.ref }})
          echo "Checking CI status for commit: $COMMIT_SHA"

          # Query check runs (GitHub Actions reports as check runs, not commit statuses)
          CI_CONCLUSION=$(gh api "repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs" \
            --paginate \
            --jq '.check_runs[] | select(.name | startswith("Test All Packages")) | .conclusion' \
            | sort -u)

          echo "CI conclusions: $CI_CONCLUSION"

          if echo "$CI_CONCLUSION" | grep -q "failure"; then
            echo "❌ CI failed. Cannot deploy."
            exit 1
          fi

          if ! echo "$CI_CONCLUSION" | grep -q "success"; then
            echo "❌ CI has not completed successfully. Cannot deploy."
            exit 1
          fi

          echo "✅ CI passed. Proceeding with deploy."

      - name: Extract package name from tag
        id: info
        run: |
          # On tag push github.ref_name is the tag; on workflow_dispatch fall back to input
          TAG_NAME="${{ github.ref_name }}"
          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "${{ github.event.repository.default_branch }}" ]]; then
            TAG_NAME="${{ inputs.release_name }}"
          fi
          if [[ -z "$TAG_NAME" ]]; then
            echo "ERROR: No tag name found"
            exit 1
          fi
          PKG_NAME=${TAG_NAME%@*}
          # Strip the "<pkg>@v" prefix to get the PEP 440 version (e.g. 0.5.2, 0.5.2rc1)
          VERSION=${TAG_NAME#*@}
          VERSION=${VERSION#v}
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying package: $PKG_NAME (version $VERSION)"

      - name: Install package dependencies
        run: |
          uv sync --package ${{ steps.info.outputs.pkg_name }} --group test

      - name: Find package directory
        id: pkg-dir
        run: |
          PKG_DIR=$(uv run python .github/scripts/get_all_packages.py ${{ steps.info.outputs.pkg_name }})
          echo "pkg_dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
          echo "Package directory: $PKG_DIR"

      - name: Test package before deployment
        run: |
          uv run pytest ${{ steps.pkg-dir.outputs.pkg_dir }} \
            --cov=${{ steps.pkg-dir.outputs.pkg_dir }} --cov-report=xml

      - name: Build package
        # The deploy is triggered by the package's release tag, so the version is
        # already known unambiguously. Pin it explicitly so the build is immune to
        # git working-tree state: a dirty tree would otherwise make hatch-vcs
        # (setuptools-scm) emit a "guess-next-dev" version like 0.5.3.dev0+g<sha>.d<date>,
        # which PyPI rejects for its local-version segment.
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.info.outputs.version }}
        run: uv build --package ${{ steps.info.outputs.pkg_name }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Make re-runs idempotent: if a package version was already uploaded in a
          # previous (partial) fan-out, skip it instead of failing with a 400.
          skip-existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.info.outputs.tag_name }}
          generate_release_notes: true
          files: './dist/*'