site_url = "https://teamtomo.org/docs/"
site_description = "Modular PyTorch packages for cryo-EM and cryo-ET."
site_author = "TeamTomo"
copyright = "Copyright &copy; 2024 - 2026 TeamTomo"
repo_url = "https://github.com/teamtomo/teamtomo"
repo_name = "teamtomo/teamtomo"
docs_dir = "docs"
site_dir = "site"
exclude_docs = """
/_snippets/
"""
extra_css = ["stylesheets/extra.css"]

