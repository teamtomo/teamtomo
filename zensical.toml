# Documentation site for the TeamTomo monorepo, built with Zensical.
#
#   uv run --isolated --only-group docs python scripts/generate_docs.py
#   uv run --isolated --only-group docs zensical serve
#
# Package pages under docs/{primitives,algorithms,utils}/, docs/developer/ and
# docs/examples/ are generated; see scripts/generate_docs.py. When a package,
# extra page or notebook is added, the generator lists the nav entries to add.

[project]
